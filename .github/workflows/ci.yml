name: AxonVex CI/CD Pipeline

# C++ standard is set in CMakeLists.txt (currently C++14). Builds pick it up via the Conan toolchain.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    # experimental legs are named clearly and set continue-on-error below so
    # a red leg never green-washes the overall run, but also never blocks it.
    name: Build and Test (${{ matrix.os }}, ${{ matrix.build_type }})${{ matrix.experimental && ' [EXPERIMENTAL]' || '' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]
        include:
          - os: ubuntu-latest
            compiler: gcc
            cpp_compiler: g++
            experimental: false
          # macOS: axonvex_core fails to compile on current macos-latest —
          # <experimental/filesystem> was removed from Apple Clang/Xcode's
          # libc++ (filesystem_compat.hpp, C++14-only per project policy, has
          # no replacement header to fall back to). This is a real, unfixed
          # portability defect distinct from C48/C49, found while auditing
          # this CI run; it needs dedicated platform work plus a real Mac to
          # fix and verify, so the leg is marked experimental rather than
          # claimed green or silently dropped.
          - os: macos-latest
            compiler: clang
            cpp_compiler: clang++
            experimental: true
          # Windows: CMake configure fails before any AxonVex source compiles
          # ("Could not find toolchain file: conan_toolchain" from
          # CMakeDetermineSystem.cmake) — a toolchain-resolution failure with
          # this runner's CMake/MSVC generator that has never been diagnosed
          # or fixed. Independently, Phase 4 (WS-PLAT) Windows support
          # (Winsock transport, LoadLibrary plugin loader) does not exist yet
          # either, so this leg would not build even past configure. Marked
          # experimental, not dropped, so Phase 4 work has a visible signal
          # to turn green.
          - os: windows-latest
            compiler: msvc
            cpp_compiler: cl
            experimental: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Conan
      run: |
        pip install conan
        conan profile detect --force

    - name: Cache Conan packages
      uses: actions/cache@v3
      with:
        path: ~/.conan2
        key: ${{ runner.os }}-conan-${{ hashFiles('**/conanfile.py') }}
        restore-keys: |
          ${{ runner.os }}-conan-

    - name: Configure CMake (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        mkdir -p build
        cd build
        conan install .. --output-folder=. --build=missing --settings=build_type=${{ matrix.build_type }}
        cmake .. -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: |
        mkdir build
        cd build
        conan install .. --output-folder=. --build=missing --settings=build_type=${{ matrix.build_type }}
        cmake .. -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: |
        cd build
        cmake --build . --config ${{ matrix.build_type }} --parallel

    # Quarantined below — keep this list honest, every entry needs a reason:
    #   *PerformanceTest, PerformanceBenchmarkTest, HighLoadPerformance,
    #   SchedulerPauseAndResume
    #       throughput/latency asserts that cannot hold on shared, noisy
    #       GitHub runners (e.g. MemoryPoolTest.PerformanceTest asserts
    #       >10M ops/s); they pass locally and are not correctness checks.
    #       Real performance numbers live in docs/benchmarks.md via the
    #       Google Benchmark harness (benchmarks/), not in these thresholds.
    #   core_tests   runs the whole binary as one test, so it re-includes
    #                every quarantined case above.
    # Same regex as the sanitizer jobs below, for consistency. Anything else
    # failing here is a real finding: fix it, do not extend this list.
    - name: Run Tests
      run: |
        cd build
        EXCLUDE='(PerformanceTest|PerformanceBenchmarkTest|HighLoadPerformance|SchedulerPauseAndResume|^core_tests$)'
        ctest --output-on-failure --parallel --build-config ${{ matrix.build_type }} -E "$EXCLUDE"

    - name: Run Examples (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        cd build/examples
        echo "=== Testing PrecisionTimer Example ==="
        ./precision_timer_example
        echo "=== Testing ThreadSafeQueue Example ==="
        ./threadSafeQueue_example
        echo "=== Testing Configuration Example ==="
        ./configuration_example
        echo "=== Testing Path Example ==="
        ./path_example

    - name: Run Examples (Windows)
      if: runner.os == 'Windows'
      run: |
        cd build/examples/${{ matrix.build_type }}
        echo "=== Testing PrecisionTimer Example ==="
        ./precision_timer_example.exe
        echo "=== Testing ThreadSafeQueue Example ==="
        ./threadSafeQueue_example.exe
        echo "=== Testing Configuration Example ==="
        ./configuration_example.exe
        echo "=== Testing Path Example ==="
        ./path_example.exe

  sanitizers:
    name: Sanitizer (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread, undefined]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Conan
      run: |
        pip install conan
        conan profile detect --force

    - name: Cache Conan packages
      uses: actions/cache@v3
      with:
        path: ~/.conan2
        key: ${{ runner.os }}-conan-${{ hashFiles('**/conanfile.py') }}
        restore-keys: |
          ${{ runner.os }}-conan-

    # Tests only: examples and plugins add build time without adding sanitizer
    # coverage, since every code path they touch is exercised by the suite.
    - name: Configure
      run: |
        mkdir -p build-san
        cd build-san
        conan install .. --output-folder=. --build=missing --settings=build_type=Debug
        cmake .. -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake \
                 -DCMAKE_BUILD_TYPE=Debug \
                 -DBUILD_TESTING=ON -DBUILD_EXAMPLES=OFF -DBUILD_PLUGINS=OFF \
                 -DAXONVEX_SANITIZER=${{ matrix.sanitizer }}

    - name: Build
      run: cmake --build build-san --parallel

    # Quarantined below — keep this list honest, every entry needs a reason:
    #   *PerformanceTest, PerformanceBenchmarkTest, HighLoadPerformance,
    #   SchedulerPauseAndResume
    #       throughput/latency asserts that cannot hold under a sanitizer's
    #       slowdown (MemoryPoolTest.PerformanceTest asserts >10M ops/s).
    #   core_tests   runs the whole binary as one test, so it re-includes
    #                every quarantined case above.
    # No known races remain quarantined: every entry here is a timing assert.
    # Anything else failing here is a real finding: fix it, do not extend this.
    - name: Run tests
      env:
        UBSAN_OPTIONS: print_stacktrace=1
        ASAN_OPTIONS: detect_leaks=1
      run: |
        EXCLUDE='(PerformanceTest|PerformanceBenchmarkTest|HighLoadPerformance|SchedulerPauseAndResume|^core_tests$)'
        echo "::notice::Quarantined from the ${{ matrix.sanitizer }} gate: $EXCLUDE"
        # TSan aborts during test discovery on kernels with high mmap_rnd_bits
        # (6.6+) unless ASLR is disabled for the process tree.
        if [ "${{ matrix.sanitizer }}" = "thread" ]; then
          setarch "$(uname -m)" -R ctest --test-dir build-san --output-on-failure -E "$EXCLUDE"
        else
          ctest --test-dir build-san --output-on-failure -E "$EXCLUDE"
        fi

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install clang-format and clang-tidy
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format clang-tidy

    - name: Check code formatting
      run: |
        # Verified: `src tests examples` are find's search roots, not a
        # boolean test, so `-name *.hpp -o -name *.cpp` (no parens) already
        # restricts both branches to those three trees — confirmed by
        # comparing output with/without grouping on a scratch tree with
        # files outside src/tests/examples. No live bug here; the explicit
        # \( -o \) grouping below is defensive clarity only (guards against
        # a future third `-o` clause silently changing precedence).
        find src tests examples \( -name "*.hpp" -o -name "*.cpp" \) | xargs clang-format --dry-run --Werror

    - name: Setup Python for Conan
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Conan
      run: |
        pip install conan
        conan profile detect --force

    - name: Configure for clang-tidy
      run: |
        mkdir -p build
        cd build
        conan install .. --output-folder=. --build=missing
        cmake .. -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Run clang-tidy
      run: |
        cd build
        # .cpp only: clang-tidy resolves a header's compiler flags by
        # locating a compile-command entry for it, and headers have none of
        # their own in compile_commands.json. Passing them directly here
        # made clang-tidy fall back to parsing them with no include paths at
        # all (spurious "file not found" on every stdlib include) rather
        # than analyzing them for real. .clang-tidy's HeaderFilterRegex
        # still surfaces diagnostics from src/**.hpp — they get analyzed
        # transitively, with real flags, via whichever .cpp includes them.
        # (tests/examples/plugins are not covered by this glob or by
        # HeaderFilterRegex; extending scope beyond `src` is a follow-up.)
        #
        # No `--warnings-as-errors` flag here: .clang-tidy's own
        # WarningsAsErrors field already encodes which checks are enforced
        # vs. deferred-but-visible (see the file for the current triage) —
        # passing `*` on the command line would override that and promote
        # every deferred, still-open finding straight to a build failure.
        find ../src -name "*.cpp" | xargs clang-tidy -p .

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check documentation files
      run: |
        echo "Checking for required documentation files..."
        test -f README.md && echo "✓ README.md exists"
        test -f LICENSE && echo "✓ LICENSE exists"
        test -f docs/software_requirements_specification.md && echo "✓ SRS exists"
        test -f docs/architecture_and_design.md && echo "✓ Architecture doc exists"
        test -f docs/implementation_plan.md && echo "✓ Implementation plan exists"
        test -f docs/project_backlog.md && echo "✓ Project backlog exists"
        echo "Documentation check completed"

  performance-benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Conan
      run: |
        pip install conan
        conan profile detect --force

    - name: Build Release version
      run: |
        mkdir -p build
        cd build
        conan install .. --output-folder=. --build=missing --settings=build_type=Release
        cmake .. -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Release \
                 -DAXONVEX_BUILD_BENCHMARKS=ON
        cmake --build . --config Release --parallel --target axonvex_benchmarks

    # The Google Benchmark microbenchmarks (benchmarks/, WS-PERF) are the
    # sanctioned home for performance numbers (docs/benchmarks.md) — this
    # step just runs them for visibility in CI logs on push-to-main. It is
    # informational, not a gate: Google Benchmark does not fail the process
    # on slow numbers, and this job's `if:` already limits it to main so a
    # noisy shared runner never blocks a PR.
    - name: Run performance benchmarks
      run: |
        cd build
        ./benchmarks/axonvex_benchmarks 