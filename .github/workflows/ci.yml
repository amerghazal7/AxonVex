name: AxonVex CI/CD Pipeline

# C++ standard is set in CMakeLists.txt (currently C++14). Builds pick it up via the Conan toolchain.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    # experimental legs are named clearly and set continue-on-error below so
    # a red leg never green-washes the overall run, but also never blocks it.
    name: Build and Test (${{ matrix.os }}, ${{ matrix.build_type }})${{ matrix.experimental && ' [EXPERIMENTAL]' || '' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]
        include:
          - os: ubuntu-latest
            compiler: gcc
            cpp_compiler: g++
            experimental: false
          # macOS: axonvex_core fails to compile on current macos-latest —
          # <experimental/filesystem> was removed from Apple Clang/Xcode's
          # libc++ (filesystem_compat.hpp, C++14-only per project policy, has
          # no replacement header to fall back to). This is a real, unfixed
          # portability defect distinct from C48/C49, found while auditing
          # this CI run; it needs dedicated platform work plus a real Mac to
          # fix and verify, so the leg is marked experimental rather than
          # claimed green or silently dropped.
          - os: macos-latest
            compiler: clang
            cpp_compiler: clang++
            experimental: true
          # Windows: CMake configure fails before any AxonVex source compiles
          # ("Could not find toolchain file: conan_toolchain" from
          # CMakeDetermineSystem.cmake) — a toolchain-resolution failure with
          # this runner's CMake/MSVC generator that has never been diagnosed
          # or fixed. Independently, Phase 4 (WS-PLAT) Windows support
          # (Winsock transport, LoadLibrary plugin loader) does not exist yet
          # either, so this leg would not build even past configure. Marked
          # experimental, not dropped, so Phase 4 work has a visible signal
          # to turn green.
          - os: windows-latest
            compiler: msvc
            cpp_compiler: cl
            experimental: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    # Pinned: Conan's dependency resolution/lockfile behavior can shift
    # between releases (same class of drift as clang-format/clang-tidy
    # below); 2.31.2 is the version this workflow and the local dev
    # environment (CLAUDE.md) were verified against.
    - name: Install Conan
      run: |
        pip install "conan==2.31.2"
        conan profile detect --force

    - name: Cache Conan packages
      uses: actions/cache@v3
      with:
        path: ~/.conan2
        key: ${{ runner.os }}-conan-${{ hashFiles('**/conanfile.py') }}
        restore-keys: |
          ${{ runner.os }}-conan-

    - name: Configure CMake (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        mkdir -p build
        cd build
        conan install .. --output-folder=. --build=missing --settings=build_type=${{ matrix.build_type }}
        cmake .. -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: |
        mkdir build
        cd build
        conan install .. --output-folder=. --build=missing --settings=build_type=${{ matrix.build_type }}
        cmake .. -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: |
        cd build
        cmake --build . --config ${{ matrix.build_type }} --parallel

    # Quarantined below — keep this list honest, every entry needs a reason:
    #   *PerformanceTest, PerformanceBenchmarkTest, HighLoadPerformance,
    #   SchedulerPauseAndResume
    #       throughput/latency asserts that cannot hold on shared, noisy
    #       GitHub runners (e.g. MemoryPoolTest.PerformanceTest asserts
    #       >10M ops/s); they pass locally and are not correctness checks.
    #       Real performance numbers live in docs/benchmarks.md via the
    #       Google Benchmark harness (benchmarks/), not in these thresholds.
    #   core_tests   runs the whole binary as one test, so it re-includes
    #                every quarantined case above.
    # Same regex as the sanitizer jobs below, for consistency. Anything else
    # failing here is a real finding: fix it, do not extend this list.
    - name: Run Tests
      run: |
        cd build
        EXCLUDE='(PerformanceTest|PerformanceBenchmarkTest|HighLoadPerformance|SchedulerPauseAndResume|^core_tests$)'
        ctest --output-on-failure --parallel --build-config ${{ matrix.build_type }} -E "$EXCLUDE"

    - name: Run Examples (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        cd build/examples
        echo "=== Testing PrecisionTimer Example ==="
        ./precision_timer_example
        echo "=== Testing ThreadSafeQueue Example ==="
        ./threadSafeQueue_example
        echo "=== Testing Configuration Example ==="
        ./configuration_example
        echo "=== Testing Path Example ==="
        ./path_example

    - name: Run Examples (Windows)
      if: runner.os == 'Windows'
      run: |
        cd build/examples/${{ matrix.build_type }}
        echo "=== Testing PrecisionTimer Example ==="
        ./precision_timer_example.exe
        echo "=== Testing ThreadSafeQueue Example ==="
        ./threadSafeQueue_example.exe
        echo "=== Testing Configuration Example ==="
        ./configuration_example.exe
        echo "=== Testing Path Example ==="
        ./path_example.exe

  sanitizers:
    name: Sanitizer (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread, undefined]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    # Pinned: see the build-and-test job's "Install Conan" step above for why.
    - name: Install Conan
      run: |
        pip install "conan==2.31.2"
        conan profile detect --force

    - name: Cache Conan packages
      uses: actions/cache@v3
      with:
        path: ~/.conan2
        key: ${{ runner.os }}-conan-${{ hashFiles('**/conanfile.py') }}
        restore-keys: |
          ${{ runner.os }}-conan-

    # Tests only: examples and plugins add build time without adding sanitizer
    # coverage, since every code path they touch is exercised by the suite.
    - name: Configure
      run: |
        mkdir -p build-san
        cd build-san
        conan install .. --output-folder=. --build=missing --settings=build_type=Debug
        cmake .. -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake \
                 -DCMAKE_BUILD_TYPE=Debug \
                 -DBUILD_TESTING=ON -DBUILD_EXAMPLES=OFF -DBUILD_PLUGINS=OFF \
                 -DAXONVEX_SANITIZER=${{ matrix.sanitizer }}

    - name: Build
      run: cmake --build build-san --parallel

    # Quarantined below — keep this list honest, every entry needs a reason:
    #   *PerformanceTest, PerformanceBenchmarkTest, HighLoadPerformance,
    #   SchedulerPauseAndResume
    #       throughput/latency asserts that cannot hold under a sanitizer's
    #       slowdown (MemoryPoolTest.PerformanceTest asserts >10M ops/s).
    #   core_tests   runs the whole binary as one test, so it re-includes
    #                every quarantined case above.
    # No known races remain quarantined: every entry here is a timing assert.
    # Anything else failing here is a real finding: fix it, do not extend this.
    - name: Run tests
      env:
        UBSAN_OPTIONS: print_stacktrace=1
        ASAN_OPTIONS: detect_leaks=1
      run: |
        EXCLUDE='(PerformanceTest|PerformanceBenchmarkTest|HighLoadPerformance|SchedulerPauseAndResume|^core_tests$)'
        echo "::notice::Quarantined from the ${{ matrix.sanitizer }} gate: $EXCLUDE"
        # TSan aborts during test discovery on kernels with high mmap_rnd_bits
        # (6.6+) unless ASLR is disabled for the process tree.
        if [ "${{ matrix.sanitizer }}" = "thread" ]; then
          setarch "$(uname -m)" -R ctest --test-dir build-san --output-on-failure -E "$EXCLUDE"
        else
          ctest --test-dir build-san --output-on-failure -E "$EXCLUDE"
        fi

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python for Conan
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    # Pinned, not `apt-get install -y clang-format clang-tidy`: that resolves
    # to whatever major version the runner image ships, which drifts (this
    # gate hit exactly that in the real run this hardening is for — Ubuntu
    # 24.04 happened to ship 18.x, but a contributor on 22.x formats their
    # tree "correctly" for their own clang-format and CI rejects it). pip's
    # prebuilt wheels give the identical binary on any OS, so this is also
    # what a contributor should run locally (see CONTRIBUTING.md) — same
    # version everywhere, not just "same version on this runner image".
    # Both pinned to the same 18.1.8 patch release so formatting and lint
    # checks come from one toolchain version — bump both together,
    # deliberately, when there's a reason to move.
    # The version check below turns "pip silently resolved something else"
    # into a hard failure instead of a quietly-different gate.
    - name: Install pinned clang-format and clang-tidy
      env:
        CLANG_FORMAT_VERSION: "18.1.8"
        CLANG_TIDY_VERSION: "18.1.8"
      run: |
        set -e
        pip install "clang-format==${CLANG_FORMAT_VERSION}" "clang-tidy==${CLANG_TIDY_VERSION}"
        got_cf="$(clang-format --version)"
        got_ct="$(clang-tidy --version)"
        echo "$got_cf"
        echo "$got_ct"
        case "$got_cf" in
          *"$CLANG_FORMAT_VERSION"*) ;;
          *) echo "::error::clang-format version mismatch: expected $CLANG_FORMAT_VERSION, got: $got_cf"; exit 1 ;;
        esac
        case "$got_ct" in
          *"$CLANG_TIDY_VERSION"*) ;;
          *) echo "::error::clang-tidy version mismatch: expected $CLANG_TIDY_VERSION, got: $got_ct"; exit 1 ;;
        esac

    - name: Check code formatting
      run: |
        set -e
        # Verified: `src tests examples` are find's search roots, not a
        # boolean test, so `-name *.hpp -o -name *.cpp` (no parens) already
        # restricts both branches to those three trees — confirmed by
        # comparing output with/without grouping on a scratch tree with
        # files outside src/tests/examples. No live bug here; the explicit
        # \( -o \) grouping below is defensive clarity only (guards against
        # a future third `-o` clause silently changing precedence).
        files="$(find src tests examples \( -name "*.hpp" -o -name "*.cpp" \))"
        # `find | xargs` with zero matches runs clang-format zero times and
        # exits 0 — a renamed/emptied source tree would make this gate pass
        # while checking nothing. Fail loudly instead of silently no-oping.
        if [ -z "$files" ]; then
          echo "::error::no .hpp/.cpp files found under src, tests, examples — formatting check would silently check nothing"
          exit 1
        fi
        echo "$files" | xargs clang-format --dry-run --Werror

    # Pinned: see the build-and-test job's "Install Conan" step for why.
    - name: Install Conan
      run: |
        pip install "conan==2.31.2"
        conan profile detect --force

    - name: Configure for clang-tidy
      run: |
        mkdir -p build
        cd build
        # build_type must be stated on BOTH lines and must match. Conan's
        # CMakeDeps gates every target property behind $<CONFIG:...>, so an
        # unmatched pair yields imported targets that exist and link nothing
        # (C48). Omitting it here previously meant conan installed Release
        # (default profile) while cmake defaulted to Debug, which the
        # configure-time guard now rejects outright instead of failing later.
        conan install .. --output-folder=. --build=missing --settings=build_type=Debug
        cmake .. -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Run clang-tidy
      run: |
        set -e
        cd build
        # .cpp only: clang-tidy resolves a header's compiler flags by
        # locating a compile-command entry for it, and headers have none of
        # their own in compile_commands.json. Passing them directly here
        # made clang-tidy fall back to parsing them with no include paths at
        # all (spurious "file not found" on every stdlib include) rather
        # than analyzing them for real. .clang-tidy's HeaderFilterRegex
        # still surfaces diagnostics from src/**.hpp — they get analyzed
        # transitively, with real flags, via whichever .cpp includes them.
        # (tests/examples/plugins are not covered by this glob or by
        # HeaderFilterRegex; extending scope beyond `src` is a follow-up.)
        #
        # No `--warnings-as-errors` flag here: .clang-tidy's own
        # WarningsAsErrors field already encodes which checks are enforced
        # vs. deferred-but-visible (see the file for the current triage) —
        # passing `*` on the command line would override that and promote
        # every deferred, still-open finding straight to a build failure.
        files="$(find ../src -name "*.cpp")"
        # Same "zero matches = silent pass" trap as the clang-format step:
        # `find | xargs` with no files runs clang-tidy zero times and exits 0.
        if [ -z "$files" ]; then
          echo "::error::no .cpp files found under src — clang-tidy gate would silently check nothing"
          exit 1
        fi
        echo "$files" | xargs clang-tidy -p .

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check documentation files
      run: |
        # `test -f X && echo ok` on its own line is a silent-failure trap:
        # bash's `-e` does not apply to the left side of `&&` (per POSIX/bash
        # semantics, only the final command in a && / || list is subject to
        # -e), and the script's overall exit code was the last unconditional
        # echo, so this job passed even with every doc file missing. `|| exit
        # 1` makes the failure explicit instead of relying on -e.
        echo "Checking for required documentation files..."
        test -f README.md && echo "✓ README.md exists" || { echo "::error::README.md is missing"; exit 1; }
        test -f LICENSE && echo "✓ LICENSE exists" || { echo "::error::LICENSE is missing"; exit 1; }
        test -f docs/software_requirements_specification.md && echo "✓ SRS exists" || { echo "::error::docs/software_requirements_specification.md is missing"; exit 1; }
        test -f docs/architecture_and_design.md && echo "✓ Architecture doc exists" || { echo "::error::docs/architecture_and_design.md is missing"; exit 1; }
        test -f docs/implementation_plan.md && echo "✓ Implementation plan exists" || { echo "::error::docs/implementation_plan.md is missing"; exit 1; }
        test -f docs/project_backlog.md && echo "✓ Project backlog exists" || { echo "::error::docs/project_backlog.md is missing"; exit 1; }
        echo "Documentation check completed"

  performance-benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    # Pinned: see the build-and-test job's "Install Conan" step for why.
    - name: Install Conan
      run: |
        pip install "conan==2.31.2"
        conan profile detect --force

    - name: Build Release version
      run: |
        mkdir -p build
        cd build
        conan install .. --output-folder=. --build=missing --settings=build_type=Release
        cmake .. -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Release \
                 -DAXONVEX_BUILD_BENCHMARKS=ON
        cmake --build . --config Release --parallel --target axonvex_benchmarks

    # The Google Benchmark microbenchmarks (benchmarks/, WS-PERF) are the
    # sanctioned home for performance numbers (docs/benchmarks.md) — this
    # step just runs them for visibility in CI logs on push-to-main. It is
    # informational, not a gate: Google Benchmark does not fail the process
    # on slow numbers, and this job's `if:` already limits it to main so a
    # noisy shared runner never blocks a PR.
    - name: Run performance benchmarks
      run: |
        cd build
        ./benchmarks/axonvex_benchmarks

  packaging:
    # Phase 3 exit criterion: "conan create and find_package work from a
    # clean machine". This job must fail loudly on any packaging breakage —
    # no continue-on-error, no quarantine list. Two independent consumption
    # paths are exercised because they go through different CMake config
    # generators:
    #   1. `conan create .` — builds+packages axonvex and runs
    #      test_package/ (conan's CMakeDeps-generated find_package, the path
    #      a conan consumer takes).
    #   2. a plain `cmake --install` + `find_package(axonvex)` against the
    #      installed axonvexConfig.cmake directly — the path a non-conan
    #      packager/consumer takes, and the one that would silently break if
    #      cmake/AxonVexConfig.cmake.in or the per-component install()
    #      layout ever drifted from what conan's package_info() assumes.
    name: Packaging (conan create + find_package)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    # Pinned: see the build-and-test job's "Install Conan" step above for why.
    - name: Install Conan
      run: |
        pip install "conan==2.31.2"
        conan profile detect --force

    - name: Cache Conan packages
      uses: actions/cache@v3
      with:
        path: ~/.conan2
        key: ${{ runner.os }}-conan-${{ hashFiles('**/conanfile.py') }}
        restore-keys: |
          ${{ runner.os }}-conan-

    # Builds axonvex from source, packages it, and automatically runs
    # test_package/downstream_consumer.cpp against the just-packaged binary
    # (conan test() step below). A failure anywhere in that chain — recipe,
    # build, package_info() component layout, or the consumer build/run —
    # fails this step non-zero.
    - name: conan create (build + package + test_package consumer)
      run: |
        set -e
        conan create . --build=missing -s build_type=Release

    # Second path: a plain, non-conan packager doing `cmake --install` then
    # `find_package(axonvex)`. Uses conan only to fetch axonvex's own
    # dependencies (nlohmann_json/onetbb), not to consume axonvex itself —
    # the point is to exercise cmake/AxonVexConfig.cmake.in and the
    # per-component libdirs/includedirs directly, the same layout
    # conanfile.py's package_info() comments describe by hand and could
    # silently drift from.
    - name: Plain cmake --install + find_package (non-conan consumer)
      run: |
        set -e
        mkdir -p build-pkg
        cd build-pkg
        conan install .. --output-folder=. --build=missing -s build_type=Release
        cmake .. -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Release \
                 -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF
        cmake --build . --parallel
        cmake --install . --prefix "${{ github.workspace }}/scratch-install"
        cd ..
        # axonvexConfig.cmake's find_dependency(nlohmann_json)/find_dependency(TBB)
        # need the conan generators dir (build-pkg, populated above by `conan
        # install`) on the prefix path too -- axonvex's own install tree only
        # carries axonvexConfig.cmake, not its dependencies' configs. Without
        # this, a runner with no system nlohmann_json/TBB config (i.e. every
        # runner that doesn't get them from somewhere else, such as a ROS 2
        # install) hard-fails at find_dependency(); a runner that happens to
        # have system copies would silently resolve against those instead of
        # the exact versions axonvex was just built and linked against.
        # Also set CMAKE_BUILD_TYPE=Release to match build-pkg: conan's
        # CMakeDeps-generated nlohmann_json-config.cmake refuses to resolve
        # (check_build_type_defined()) unless the consumer declares the same
        # build_type it was generated for.
        cmake -B downstream-build -S test_package \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="${{ github.workspace }}/scratch-install/lib/cmake/axonvex;${{ github.workspace }}/build-pkg"
        cmake --build downstream-build --parallel
        ./downstream-build/downstream_consumer

    # Symbol-visibility trap (see conanfile.py / src/libs/axonvex_net's
    # CXX_VISIBILITY_PRESET comments): a wrongly-hidden symbol fails at
    # dlopen time, not link time, so a green build above proves nothing
    # about it. axonvex_core must stay fully default-visibility because
    # PluginManager dlopens plugins that resolve axonvex_core symbols;
    # axonvex_net is the one deliberately hidden target. This is a coarse
    # symbol-count tripwire, not a substitute for the PluginManagerTest
    # dlopen fixtures (normal/bad-ABI/no-symbols/throwing-init), which run
    # under the main build-and-test job's ctest gate.
    - name: Verify symbol visibility boundary
      run: |
        set -e
        # grep -c exits 1 on a zero match, which would abort the script
        # (set -e) before the diagnostic below prints -- append `|| true`
        # so a genuine zero-export collapse still reaches the ::error:: line
        # instead of just dying with a bare non-zero exit.
        core_exports="$(nm -D build-pkg/src/libs/axonvex_core/libaxonvex_core.so | grep -c ' T \| W ' || true)"
        echo "axonvex_core exported symbols: $core_exports"
        if [ "$core_exports" -lt 100 ]; then
          echo "::error::axonvex_core exports only $core_exports symbols -- hidden visibility may have leaked onto core, which PluginManager's dlopen path needs default-visibility"
          exit 1
        fi
        net_exports="$(nm -D build-pkg/src/libs/axonvex_net/libaxonvex_net.so | grep -c ' T \| W ' || true)"
        echo "axonvex_net exported symbols: $net_exports"
